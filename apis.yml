name: Karnott
description: 'Karnott is a French agricultural technology company based in Lille that
  builds connected tracking devices and a digital management platform for farms, equipment
  cooperatives (CUMA), agricultural contractors (ETA), and wine growers. Its beacon
  automatically records equipment usage and field interventions without manual data
  entry, enabling real-time fleet and equipment monitoring, fuel-cost tracking, parcel
  mapping, and precise billing and regulatory documentation. Karnott is a portfolio
  company of Partech. This profile was added to the API Evangelist network for enrichment;
  no public developer API, OpenAPI, or developer portal was found on the provider''s
  public surface as of this pass.'
